<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>會議錄音轉紀錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左「錄音＋逐字稿」、右「會議紀錄」兩欄，手機上下堆疊 */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --sunk:#F6F8F8; --ink:#1B2430; --muted:#5A6572; --line:#D6DCE0;
  --accent:#1D5C86; --accent-ink:#FFFFFF; --rec:#C3362B; --rec-soft:#F8E3E0; --ok:#2E7D4F;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1A2129; --sunk:#151B21; --ink:#E6EBEF; --muted:#9AA5B0; --line:#2C3640;
  --accent:#6FB0DC; --accent-ink:#0C1620; --rec:#F0675B; --rec-soft:#3A1F1D; --ok:#6CC28F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --sunk:#151B21; --ink:#E6EBEF; --muted:#9AA5B0; --line:#2C3640;
  --accent:#6FB0DC; --accent-ink:#0C1620; --rec:#F0675B; --rec-soft:#3A1F1D; --ok:#6CC28F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.step{font-family:var(--font-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 7px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.recorder{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.recbtn{width:64px;height:64px;border-radius:50%;border:3px solid var(--rec);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.recbtn span{width:26px;height:26px;border-radius:50%;background:var(--rec);transition:all .2s}
.recbtn.on span{border-radius:5px;width:22px;height:22px}
.recbtn.on{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--rec-soft)}50%{box-shadow:0 0 0 10px var(--rec-soft)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}}
.timer{font-family:var(--font-mono);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.status{font-size:13px;color:var(--muted)}
.status.live{color:var(--rec);font-weight:500}
.rmeta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:14px;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.interim{min-height:1.6em;font-size:14px;color:var(--muted);font-style:italic}
#transcript{min-height:280px;resize:vertical;font-size:14px;line-height:1.75}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.notice{font-size:13px;padding:10px 12px;border-radius:6px;background:var(--rec-soft);color:var(--ink);border:1px solid var(--line)}
.notice.ok{background:var(--sunk)}
.minutes{min-height:380px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:16px 18px;overflow-wrap:anywhere}
.minutes h1{font-size:19px;margin:0 0 8px}
.minutes h2{font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--accent)}
.minutes h3{font-size:14px;margin:12px 0 4px}
.minutes p{margin:4px 0}
.minutes ul{margin:4px 0;padding-left:1.3em}
.minutes li{margin:2px 0}
.empty{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px}
.empty ol{margin:0;padding-left:1.3em}
.ts{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>會議錄音轉紀錄</h1>
    <p>開會時按下錄音，邊講邊轉成文字；散會後一鍵整理成會議紀錄。</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="h-rec">
      <h2 id="h-rec"><span class="step">1</span>會議資訊與錄音</h2>
      <div class="fields">
        <label class="full">會議名稱<input id="f-title" placeholder="例：2027 工具機展籌備會議"></label>
        <label>日期<input id="f-date" type="date"></label>
        <label>辨識語言
          <select id="f-lang"><option value="zh-TW">中文（台灣）</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select>
        </label>
        <label class="full">出席人員<input id="f-people" placeholder="例：鄭副組長、俞萱、啟維"></label>
      </div>

      <div class="recorder">
        <button class="recbtn" id="recbtn" aria-label="開始錄音"><span></span></button>
        <div class="rmeta">
          <div class="timer" id="timer">00:00:00</div>
          <div class="status" id="status">按紅色按鈕開始錄音</div>
        </div>
        <div class="ctrls">
          <button class="btn" id="pausebtn" disabled>暫停</button>
        </div>
      </div>
      <div id="micnote" class="notice" hidden></div>

      <div class="row">
        <strong style="font-size:14px">逐字稿</strong>
        <div class="ctrls">
          <button class="btn" id="samplebtn">試用範例</button>
          <button class="btn" id="clearbtn">清除</button>
        </div>
      </div>
      <div class="interim" id="interim" aria-live="polite"></div>
      <textarea id="transcript" placeholder="錄音轉出的文字會出現在這裡，可以直接修改。&#10;也可以把其他地方轉好的逐字稿貼進來。"></textarea>
      <div class="hint">逐字稿會自動暫存在這台裝置的瀏覽器裡，重新整理不會不見。</div>
    </section>

    <section class="panel" aria-labelledby="h-min">
      <h2 id="h-min"><span class="step">2</span>會議紀錄</h2>
      <div class="ctrls">
        <button class="btn primary" id="makebtn">整理成會議紀錄</button>
        <button class="btn" id="copybtn" disabled>複製紀錄</button>
        <button class="btn" id="dlbtn" hidden disabled>下載 .txt</button>
      </div>
      <div id="makenote" class="notice ok" hidden></div>
      <div class="minutes" id="minutes">
        <div class="empty">
          <strong>整理後會包含：</strong>
          <ol>
            <li>會議資訊（名稱、日期、出席人員）</li>
            <li>會議摘要</li>
            <li>討論事項（依議題分段）</li>
            <li>決議事項</li>
            <li>待辦事項：事項｜負責人｜期限</li>
          </ol>
          <span>整理完可以直接修改文字，再複製貼到 Email 或 Word。</span>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const inFrame = (()=>{ try{ return window.self !== window.top }catch(e){ return true } })();
  const isLocal = !inFrame;
  const store = {
    get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
    set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
  };

  // 預設日期與暫存還原
  const today = new Date(); const pad = n => String(n).padStart(2,'0');
  $('f-date').value = store.get('mm-date') || `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  ['title','people','lang'].forEach(k => { const v = store.get('mm-'+k); if(v) $('f-'+k).value = v; });
  $('transcript').value = store.get('mm-transcript') || '';
  ['title','people','lang','date'].forEach(k => $('f-'+k).addEventListener('input', e => store.set('mm-'+k, e.target.value)));
  $('transcript').addEventListener('input', () => store.set('mm-transcript', $('transcript').value));
  if(isLocal) $('dlbtn').hidden = false;

  // Claude 整理（在 Claude 網頁裡開啟時可用）
  let samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);

  // ---------- 錄音 ----------
  let rec = null, recording = false, paused = false, elapsed = 0, tickStart = 0, timerId = null, wakeLock = null;
  const fmt = s => `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;
  const nowSec = () => elapsed + (tickStart ? (Date.now()-tickStart)/1000 : 0);
  function setStatus(t, live){ $('status').textContent = t; $('status').classList.toggle('live', !!live); }
  function showMic(msg){ $('micnote').textContent = msg; $('micnote').hidden = false; }

  function appendFinal(text){
    text = text.trim(); if(!text) return;
    const s = nowSec(); const stamp = `[${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}]`;
    const ta = $('transcript');
    ta.value += (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + stamp + ' ' + text + '\n';
    ta.scrollTop = ta.scrollHeight;
    store.set('mm-transcript', ta.value);
  }

  function buildRec(){
    const r = new SR();
    r.lang = $('f-lang').value; r.continuous = true; r.interimResults = true;
    r.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res = e.results[i];
        if(res.isFinal) appendFinal(res[0].transcript); else interim += res[0].transcript;
      }
      $('interim').textContent = interim;
    };
    r.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture'){
        stopAll();
        showMic(isLocal
          ? '沒有拿到麥克風權限。請點網址列左邊的圖示，把「麥克風」改成允許，再按一次錄音。'
          : '在 Claude 裡開啟時無法使用麥克風。請下載這個網頁檔，用電腦的 Chrome 開啟就能錄音；或者把逐字稿貼到下方，一樣可以整理成會議紀錄。');
      } else if(e.error === 'network'){
        setStatus('網路中斷，連線恢復後會自動繼續', true);
      }
    };
    r.onend = () => { if(recording && !paused){ try{ r.start() }catch(err){} } };
    return r;
  }

  async function startRec(){
    if(!SR){ showMic('這個瀏覽器不支援語音辨識。請改用電腦或 Android 的 Chrome，或 iPhone 的 Safari。'); return; }
    $('micnote').hidden = true;
    rec = buildRec();
    try{ rec.start() }catch(e){}
    recording = true; paused = false; tickStart = Date.now();
    timerId = setInterval(()=> $('timer').textContent = fmt(nowSec()), 500);
    $('recbtn').classList.add('on'); $('recbtn').setAttribute('aria-label','結束錄音');
    $('pausebtn').disabled = false; $('pausebtn').textContent = '暫停';
    setStatus('錄音中…請讓手機或電腦靠近說話的人', true);
    try{ wakeLock = await navigator.wakeLock?.request('screen') }catch(e){}
  }
  function stopAll(){
    recording = false; paused = false;
    if(tickStart){ elapsed += (Date.now()-tickStart)/1000; tickStart = 0; }
    clearInterval(timerId); $('timer').textContent = fmt(elapsed);
    try{ rec && rec.stop() }catch(e){}
    $('recbtn').classList.remove('on'); $('recbtn').setAttribute('aria-label','開始錄音');
    $('pausebtn').disabled = true; $('interim').textContent = '';
    setStatus(elapsed ? '已結束錄音，可以按「整理成會議紀錄」' : '按紅色按鈕開始錄音');
    try{ wakeLock && wakeLock.release() }catch(e){} wakeLock = null;
  }
  $('recbtn').addEventListener('click', () => recording ? stopAll() : startRec());
  $('pausebtn').addEventListener('click', () => {
    if(!recording) return;
    if(!paused){
      paused = true; elapsed += (Date.now()-tickStart)/1000; tickStart = 0;
      try{ rec.stop() }catch(e){}
      $('pausebtn').textContent = '繼續'; setStatus('已暫停');
    } else {
      paused = false; tickStart = Date.now(); rec = buildRec();
      try{ rec.start() }catch(e){}
      $('pausebtn').textContent = '暫停'; setStatus('錄音中…', true);
    }
  });
  $('f-lang').addEventListener('change', () => { if(recording && !paused){ try{ rec.stop() }catch(e){} rec = buildRec(); try{ rec.start() }catch(e){} } });

  $('clearbtn').addEventListener('click', () => {
    if(recording) stopAll();
    $('transcript').value = ''; store.set('mm-transcript',''); elapsed = 0; $('timer').textContent = fmt(0);
    setStatus('按紅色按鈕開始錄音');
  });
  $('samplebtn').addEventListener('click', () => {
    $('f-title').value = '（範例）年底展覽宣傳分工會議';
    $('f-people').value = '組長、小陳、小林、俞萱';
    $('transcript').value =
`[00:12] 好那我們開始今天主要是討論年底展覽的宣傳分工
[00:30] 小陳這邊攤位設計初稿下週三可以給大家看
[01:05] 組長覺得主視覺要再突出技術成果不要只放產品照片
[01:48] 俞萱負責臉書跟電子報的宣傳預計展前兩週開始發
[02:20] 小林說邀請函名單還差大概五十家廠商要再補
[02:55] 那就決定邀請函十一月十五號前寄出
[03:30] 預算的部分還要再跟會計確認下次會議再討論`;
    store.set('mm-transcript', $('transcript').value);
    store.set('mm-title', $('f-title').value); store.set('mm-people', $('f-people').value);
  });

  // ---------- 整理成會議紀錄 ----------
  function buildPrompt(){
    return `你是工研院的行政同仁，請把以下會議逐字稿整理成正式的中文會議紀錄（繁體中文、台灣用語）。

會議名稱：${$('f-title').value || '（未填）'}
日期：${$('f-date').value || '（未填）'}
出席人員：${$('f-people').value || '（未填，可從逐字稿判斷）'}

規則：
- 逐字稿是語音辨識結果，可能有錯字或斷句錯誤，請依上下文修正，但不要捏造逐字稿沒有的內容。
- 語氣精簡、條列為主，去掉口語贅詞。
- 沒提到的項目寫「無」或「未提及」，負責人或期限不明寫「待確認」。
- 只輸出會議紀錄本身，用以下 Markdown 格式：

# 會議紀錄：（會議名稱）
## 會議資訊
- 日期：
- 出席人員：
## 會議摘要
（2–3 句）
## 討論事項
### 一、（議題）
- 重點
## 決議事項
-
## 待辦事項
- 事項｜負責人｜期限
## 其他備註
-

逐字稿：
"""
${$('transcript').value.trim()}
"""`;
  }

  function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  function renderMd(md){
    const out = []; let inList = false;
    for(const raw of md.split('\n')){
      const line = raw.trimEnd();
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if(li){ if(!inList){ out.push('<ul>'); inList = true; } out.push('<li>'+inline(li[1])+'</li>'); continue; }
      if(inList){ out.push('</ul>'); inList = false; }
      let m;
      if((m = line.match(/^###\s+(.*)/))) out.push('<h3>'+inline(m[1])+'</h3>');
      else if((m = line.match(/^##\s+(.*)/))) out.push('<h2>'+inline(m[1])+'</h2>');
      else if((m = line.match(/^#\s+(.*)/))) out.push('<h1>'+inline(m[1])+'</h1>');
      else if(line.trim()) out.push('<p>'+inline(line)+'</p>');
    }
    if(inList) out.push('</ul>');
    return out.join('');
  }

  let minutesText = '';
  function note(msg){ $('makenote').textContent = msg; $('makenote').hidden = !msg; }
  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); return true }catch(e){
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand('copy') }catch(err){} ta.remove(); return ok;
    }
  }

  let busy = false;
  $('makebtn').addEventListener('click', async () => {
    if(busy) return;
    if(!$('transcript').value.trim()){ note('逐字稿是空的。先錄音，或把逐字稿貼到左邊。'); return; }
    if(recording) stopAll();
    const prompt = buildPrompt();
    const sample = await samplePromise;
    if(!sample){
      const ok = await copyText(prompt);
      note(ok ? '已複製「整理指令＋逐字稿」。打開 Claude 貼上送出，就會產出會議紀錄。'
              : '無法自動複製，請改在 Claude 裡開啟這個頁面使用。');
      return;
    }
    busy = true; $('makebtn').disabled = true; $('makebtn').textContent = '整理中…';
    note(''); $('minutes').innerHTML = '<p class="hint">Claude 正在整理…</p>';
    try{
      const res = await sample(prompt, { modelTier:'default', cache:false,
        onText: ({text}) => { minutesText = text; $('minutes').innerHTML = renderMd(text); } });
      minutesText = res.text; $('minutes').innerHTML = renderMd(minutesText);
      $('minutes').contentEditable = 'true';
      $('copybtn').disabled = false; $('dlbtn').disabled = false;
      note('整理完成。可以直接點文字修改，再按「複製紀錄」。');
    }catch(e){
      const msg = e && e.code === 'not_granted' ? '需要允許這個頁面使用 Claude 才能整理。'
                : e && e.code === 'rate_limited' ? '使用太頻繁，請稍等一下再試。'
                : '整理失敗：' + ((e && e.message) || '請再試一次');
      note(msg);
      if(minutesText) $('copybtn').disabled = false;
    }finally{
      busy = false; $('makebtn').disabled = false; $('makebtn').textContent = '整理成會議紀錄';
    }
  });

  $('copybtn').addEventListener('click', async () => {
    const t = $('minutes').innerText.trim();
    note(await copyText(t) ? '已複製會議紀錄。' : '無法自動複製，請手動選取文字後複製。');
  });
  $('dlbtn').addEventListener('click', () => {
    const t = $('minutes').innerText.trim();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type:'text/plain;charset=utf-8'}));
    a.download = ($('f-title').value || '會議紀錄') + '_' + ($('f-date').value || '') + '.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });
})();
</script>

</body></html>
